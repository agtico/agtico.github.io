<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambient · Investor presentation</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/brand/ambient-mark.png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f9fc;color:#141b2d;font:16px/1.5 Inter,system-ui,sans-serif}
  form{width:min(380px,calc(100% - 40px));background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:30px 28px;text-align:center}
  img{width:48px;height:48px;margin:0 auto 14px;display:block}
  h1{font:500 26px Oswald,Inter,system-ui,sans-serif;margin:0 0 6px}
  p{margin:0 0 18px;color:#6a7387;font-size:14.5px}
  input{width:100%;box-sizing:border-box;font:inherit;padding:12px 14px;border:1px solid #cfd7e2;border-radius:9px;margin-bottom:12px}
  button{width:100%;font:600 15px Inter,system-ui,sans-serif;padding:12px;border:0;border-radius:9px;background:#141b2d;color:#fff;cursor:pointer}
  button[disabled]{opacity:.6;cursor:wait}
  .err{color:#a8322d;font-size:14px;min-height:20px;margin:10px 0 0}
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <img src="assets/brand/ambient-mark.png" alt="Ambient">
  <h1>Ambient</h1>
  <p>Confidential investor presentation. Enter the passphrase you were given.</p>
  <input id="pw" type="password" placeholder="Passphrase" aria-label="Passphrase" required autofocus>
  <button id="go" type="submit">Open</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
// The deck is encrypted (PBKDF2-SHA256 600k -> AES-256-GCM). The passphrase never leaves the
// browser; it is kept in sessionStorage for this tab only.
const KEY = 'ambient-deck-pass';
const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function open(pass) {
  const bundle = await (await fetch('deck.enc', { cache: 'no-store' })).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b(bundle.salt), iterations: bundle.iterations }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(bundle.iv) }, key, b(bundle.ct));
  const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', plain))].map((x) => x.toString(16).padStart(2, '0')).join('');
  if (hash !== bundle.sha256) throw new Error('integrity');
  sessionStorage.setItem(KEY, pass);
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
const form = document.getElementById('gate'), go = document.getElementById('go'), err = document.getElementById('err');
form.addEventListener('submit', async (e) => {
  e.preventDefault(); go.disabled = true; err.textContent = '';
  try { await open(document.getElementById('pw').value); }
  catch (x) { err.textContent = 'That passphrase did not open the deck.'; go.disabled = false; }
});
const saved = sessionStorage.getItem(KEY);
if (saved) open(saved).catch(() => sessionStorage.removeItem(KEY));
</script>
</body>
</html>
